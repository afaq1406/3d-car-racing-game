<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Highway Racer - 100 Levels</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #hud {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-bar {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
    }
    .level-badge {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
    }
    .progress-wrap {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar-bg {
      width: 160px;
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #10b981);
      transition: width 0.2s linear;
    }
    .stats-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .coin-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(234, 179, 8, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      color: #facc15;
    }
    .btn-action {
      pointer-events: auto;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: rgba(51, 65, 85, 1);
    }
    .speedo-cluster {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .speedo-dial {
      width: 150px;
      height: 90px;
      background: rgba(10, 15, 25, 0.85);
      border: 2px solid rgba(255,255,255,0.1);
      border-bottom: none;
      border-top-left-radius: 90px;
      border-top-right-radius: 90px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 15px;
    }
    .speed-number {
      font-size: 42px;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      line-height: 1;
    }
    .speed-unit {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .nitro-gauge {
      width: 190px;
      height: 10px;
      background: #0f172a;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 0 0 6px 6px;
      overflow: hidden;
      padding: 1px;
    }
    .nitro-gauge-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 2px;
    }
    .nitro-gauge-fill.active {
      background: linear-gradient(90deg, #00f5d4, #7b2cbf);
      box-shadow: 0 0 10px #00f5d4;
    }
    .nitro-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      width: 190px;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      color: #fff;
    }
    .btn-primary {
      width: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }
    .stat-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 10px;
    }
    .stat-box-label { font-size: 11px; color: #94a3b8; }
    .stat-box-val { font-size: 18px; font-weight: 800; color: #fff; margin-top: 4px; font-family: monospace; }
    .car-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .car-option.selected {
      border-color: #06b6d4;
      background: rgba(6, 182, 212, 0.15);
    }
    .mobile-controls {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 20;
    }
    @media (max-width: 900px) {
      .mobile-controls { display: flex; }
    }
    .pad-btn {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pedal-btn {
      width: 64px;
      height: 70px;
      border-radius: 12px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pedal-gas { background: rgba(16, 185, 129, 0.8); border: 1px solid #10b981; }
    .pedal-brake { background: rgba(239, 68, 68, 0.8); border: 1px solid #ef4444; }
    .pedal-nitro { background: rgba(6, 182, 212, 0.8); border: 1px solid #06b6d4; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="top-bar">
      <div>
        <div class="level-badge" id="hud-level">LEVEL 1 / 100</div>
        <div class="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="hud-progress-fill"></div></div>
          <span style="font-size: 11px; font-family: monospace;" id="hud-distance-text">0m / 600m</span>
        </div>
      </div>
      <div class="stats-right">
        <div class="coin-badge">🪙 <span id="hud-coins">0</span></div>
        <button class="btn-action" id="hud-btn-garage">GARAGE</button>
        <button class="btn-action" id="hud-btn-sound">🔊</button>
        <button class="btn-action" id="hud-btn-pause">PAUSE</button>
      </div>
    </div>
    <div class="speedo-cluster">
      <div class="speedo-dial">
        <div class="speed-number" id="hud-speed">0</div>
        <div class="speed-unit">KM / H</div>
      </div>
      <div class="nitro-gauge"><div class="nitro-gauge-fill" id="hud-nitro-fill"></div></div>
      <div class="nitro-label"><span>NITRO (SHIFT)</span><span id="hud-nitro-pct">100%</span></div>
    </div>
  </div>

  <div class="mobile-controls">
    <div style="display: flex; gap: 8px;">
      <button class="pad-btn" id="m-left">◀</button>
      <button class="pad-btn" id="m-right">▶</button>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="pedal-btn pedal-brake" id="m-brake">BRAKE</button>
      <button class="pedal-btn pedal-nitro" id="m-nitro">NITRO</button>
      <button class="pedal-btn pedal-gas" id="m-gas">GAS</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-garage">
    <div class="modal-card">
      <h2 style="font-size: 24px; font-weight: 900; margin-bottom: 4px;">GARAGE & TUNING</h2>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 16px;">Choose your vehicle and upgrade stats.</p>
      <div id="garage-cars-list"></div>
      <div class="stats-grid" id="garage-stats-view"></div>
      <button class="btn-primary" id="garage-btn-drive">DRIVE SELECTED CAR</button>
      <button class="btn-secondary" id="garage-btn-close">CLOSE</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-pause">
    <div class="modal-card" style="max-width: 400px; text-align: center;">
      <h2 style="font-size: 24px; font-weight: 900; margin-bottom: 4px;">GAME PAUSED</h2>
      <button class="btn-primary" id="pause-btn-resume">RESUME (ESC)</button>
      <button class="btn-secondary" id="pause-btn-restart">RESTART LEVEL</button>
      <button class="btn-secondary" id="pause-btn-garage">OPEN GARAGE</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-complete">
    <div class="modal-card" style="max-width: 440px; text-align: center;">
      <div style="font-size: 40px; margin-bottom: 8px;">🏆</div>
      <h2 style="font-size: 24px; font-weight: 900; margin-bottom: 4px;" id="complete-title">LEVEL 1 COMPLETE!</h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-box-label">Reward Coins</div><div class="stat-box-val" id="complete-coins">+150</div></div>
        <div class="stat-box"><div class="stat-box-label">Near Misses</div><div class="stat-box-val" id="complete-near-miss">0</div></div>
      </div>
      <button class="btn-primary" id="complete-btn-next">NEXT LEVEL ▶</button>
      <button class="btn-secondary" id="complete-btn-replay">REPLAY LEVEL</button>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-failed">
    <div class="modal-card" style="max-width: 440px; text-align: center;">
      <div style="font-size: 40px; margin-bottom: 8px;">💥</div>
      <h2 style="font-size: 24px; font-weight: 900; margin-bottom: 4px; color: #ef4444;">LEVEL FAILED</h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-box-label">Coins Saved</div><div class="stat-box-val" id="failed-coins">+0</div></div>
        <div class="stat-box"><div class="stat-box-label">Distance Driven</div><div class="stat-box-val" id="failed-distance">0m</div></div>
      </div>
      <button class="btn-primary" id="failed-btn-retry" style="background: linear-gradient(90deg, #ef4444, #f97316);">RETRY LEVEL</button>
      <button class="btn-secondary" id="failed-btn-garage">VISIT GARAGE</button>
    </div>
  </div>

  <script>
    class WebAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.engineOsc1 = null;
        this.engineOsc2 = null;
        this.engineFilter = null;
        this.engineGain = null;
        this.nitroNoise = null;
        this.nitroGain = null;
        this.isNitroPlaying = false;
      }
      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        this.ctx = new AudioContextClass();
        this.engineOsc1 = this.ctx.createOscillator();
        this.engineOsc2 = this.ctx.createOscillator();
        this.engineFilter = this.ctx.createBiquadFilter();
        this.engineGain = this.ctx.createGain();
        this.engineOsc1.type = 'sawtooth';
        this.engineOsc2.type = 'triangle';
        this.engineOsc1.frequency.setValueAtTime(45, this.ctx.currentTime);
        this.engineOsc2.frequency.setValueAtTime(70, this.ctx.currentTime);
        this.engineFilter.type = 'lowpass';
        this.engineFilter.frequency.setValueAtTime(280, this.ctx.currentTime);
        this.engineGain.gain.setValueAtTime(this.muted ? 0 : 0.08, this.ctx.currentTime);
        this.engineOsc1.connect(this.engineFilter);
        this.engineOsc2.connect(this.engineFilter);
        this.engineFilter.connect(this.engineGain);
        this.engineGain.connect(this.ctx.destination);
        this.engineOsc1.start();
        this.engineOsc2.start();
      }
      updateEngine(speedKmh, maxSpeed, isAccel) {
        if (!this.ctx || !this.engineOsc1 || this.muted) return;
        const ratio = Math.min(1, Math.max(0, speedKmh / maxSpeed));
        const freq = 45 + ratio * 160 + (isAccel ? 25 : 0);
        const filterFreq = 220 + ratio * 850 + (isAccel ? 150 : 0);
        const now = this.ctx.currentTime;
        this.engineOsc1.frequency.setTargetAtTime(freq, now, 0.08);
        this.engineOsc2.frequency.setTargetAtTime(freq * 1.5, now, 0.08);
        this.engineFilter.frequency.setTargetAtTime(filterFreq, now, 0.08);
        this.engineGain.gain.setTargetAtTime(0.04 + ratio * 0.12, now, 0.08);
      }
      startNitro() {
        if (this.isNitroPlaying || !this.ctx || this.muted) return;
        this.isNitroPlaying = true;
        try {
          const bufferSize = this.ctx.sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          this.nitroNoise = this.ctx.createBufferSource();
          this.nitroNoise.buffer = buffer;
          this.nitroNoise.loop = true;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(900, this.ctx.currentTime);
          this.nitroGain = this.ctx.createGain();
          this.nitroGain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          this.nitroNoise.connect(filter);
          filter.connect(this.nitroGain);
          this.nitroGain.connect(this.ctx.destination);
          this.nitroNoise.start();
        } catch(e){}
      }
      stopNitro() {
        if (!this.isNitroPlaying || !this.ctx) return;
        this.isNitroPlaying = false;
        if (this.nitroGain) {
          this.nitroGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
          setTimeout(() => { try { this.nitroNoise.stop(); } catch(e){} }, 60);
        }
      }
      playCoin() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1318, now);
        osc.frequency.setValueAtTime(1975, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      playCrash() {
        if (!this.ctx || this.muted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.5);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      }
      playLevelWin() {
        if (!this.ctx || this.muted) return;
        [523, 659, 783, 1046].forEach((freq, idx) => {
          const t = this.ctx.currentTime + idx * 0.1;
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start(t);
          o.stop(t + 0.35);
        });
      }
      toggleMute() {
        this.muted = !this.muted;
        if (this.engineGain && this.ctx) {
          this.engineGain.gain.setValueAtTime(this.muted ? 0 : 0.08, this.ctx.currentTime);
        }
        if (this.muted) this.stopNitro();
        return this.muted;
      }
    }
    const audio = new WebAudioEngine();

    const CARS_DATA = [
      { id: 'sports_car', name: 'Apex GT-R', category: 'Sports Car', price: 0, unlocked: true, color: '#e63946', speed: 215, accel: 75, handling: 85, nitro: 3.5 },
      { id: 'muscle_car', name: 'V8 Thunder', category: 'Muscle Car', price: 650, unlocked: false, color: '#f77f00', speed: 245, accel: 90, handling: 68, nitro: 4.2 },
      { id: 'supercar', name: 'Phantom Hyperion', category: 'Supercar', price: 1800, unlocked: false, color: '#00f5d4', speed: 285, accel: 98, handling: 95, nitro: 5.5 }
    ];

    let currentLevel = 1;
    let coins = parseInt(localStorage.getItem('hr_coins') || '0', 10);
    let activeCarId = 'sports_car';
    let isPaused = false;
    let isGameOver = false;
    let isLevelComplete = false;

    let posX = 0, posZ = 0, speedKmh = 0, nitroPercent = 100, isNitroActive = false;
    let distanceDriven = 0, nearMissCount = 0, coinsRun = 0;

    const keys = {};
    let touchSteer = 0, touchGas = false, touchBrake = false, touchNitro = false;

    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111625);
    scene.fog = new THREE.FogExp2(0x111625, 0.0035);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 800);
    camera.position.set(0, 4.2, 8.5);

    const ambLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
    dirLight.position.set(30, 50, -30);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 12);
    wheelGeo.rotateZ(Math.PI / 2);
    const rubberMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x101a24, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.8 });
    const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const tlMat = new THREE.MeshBasicMaterial({ color: 0xff1122 });

    function makeWheel(x, y, z) {
      const w = new THREE.Mesh(wheelGeo, rubberMat);
      w.position.set(x, y, z);
      return w;
    }

    function createPlayerMesh(carId, colorHex) {
      const g = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.6, roughness: 0.25 });
      if (carId === 'muscle_car') {
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.55, 4.4), bodyMat);
        body.position.y = 0.55;
        const scoop = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.8), chromeMat);
        scoop.position.set(0, 0.95, -1.1);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.48, 1.9), glassMat);
        cabin.position.set(0, 1.0, 0.15);
        g.add(body, scoop, cabin, makeWheel(-1.05, 0.38, -1.3), makeWheel(1.05, 0.38, -1.3), makeWheel(-1.05, 0.38, 1.4), makeWheel(1.05, 0.38, 1.4));
      } else if (carId === 'supercar') {
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.42, 4.4), bodyMat);
        body.position.y = 0.42;
        const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.85, 12, 10), glassMat);
        canopy.scale.set(0.85, 0.55, 1.5);
        canopy.position.set(0, 0.68, 0.1);
        const wing = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.05, 0.4), chromeMat);
        wing.position.set(0, 1.05, 1.95);
        g.add(body, canopy, wing, makeWheel(-1.02, 0.34, -1.25), makeWheel(1.02, 0.34, -1.25), makeWheel(-1.02, 0.34, 1.35), makeWheel(1.02, 0.34, 1.35));
      } else {
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.45, 4.2), bodyMat);
        body.position.y = 0.45;
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 1.8), glassMat);
        cabin.position.set(0, 0.85, 0.1);
        const wing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.35), bodyMat);
        wing.position.set(0, 1.0, 1.9);
        g.add(body, cabin, wing, makeWheel(-0.95, 0.35, -1.2), makeWheel(0.95, 0.35, -1.2), makeWheel(-0.95, 0.35, 1.3), makeWheel(0.95, 0.35, 1.3));
      }
      const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.1), hlMat);
      hl1.position.set(-0.65, 0.5, -2.1);
      const hl2 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.12, 0.1), hlMat);
      hl2.position.set(0.65, 0.5, -2.1);
      const tl = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 0.1), tlMat);
      tl.position.set(0, 0.5, 2.1);
      g.add(hl1, hl2, tl);
      return g;
    }

    let playerCar = createPlayerMesh(activeCarId, CARS_DATA[0].color);
    scene.add(playerCar);

    const ROAD_WIDTH = 14.0, SEG_LEN = 60.0, NUM_SEGS = 10;
    const roadSegments = [];
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e2430, roughness: 0.8 });
    const curbMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
    const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    function createSegment(z) {
      const seg = new THREE.Group();
      seg.position.z = z;
      const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, SEG_LEN), roadMat);
      road.rotateX(-Math.PI / 2);
      seg.add(road);
      const curbL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, SEG_LEN), curbMat);
      curbL.position.set(-ROAD_WIDTH/2 - 0.25, 0.12, 0);
      const curbR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, SEG_LEN), curbMat);
      curbR.position.set(ROAD_WIDTH/2 + 0.25, 0.12, 0);
      seg.add(curbL, curbR);

      for (let d = 0; d < 8; d++) {
        const zOff = -SEG_LEN / 2 + (d + 0.5) * (SEG_LEN / 8);
        [-3.0, 0.0, 3.0].forEach(lx => {
          const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 3.5), dashMat);
          dash.rotateX(-Math.PI / 2);
          dash.position.set(lx, 0.015, zOff);
          seg.add(dash);
        });
      }
      return seg;
    }

    for (let i = 0; i < NUM_SEGS; i++) {
      const z = -i * SEG_LEN;
      const seg = createSegment(z);
      scene.add(seg);
      roadSegments.push({ group: seg, zPos: z });
    }

    const LANES = [-4.5, -1.5, 1.5, 4.5];
    const trafficList = [], coinsList = [];
    let trafficTimer = 0;
    const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.12, 16);
    coinGeo.rotateX(Math.PI / 2);
    const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffaa00, emissiveIntensity: 0.6, metalness: 0.8 });

    function spawnTraffic() {
      const laneIdx = Math.floor(Math.random() * LANES.length);
      const laneX = LANES[laneIdx];
      const spawnZ = posZ - 130 - Math.random() * 60;
      const colors = [0x3b82f6, 0xef4444, 0x10b981, 0xf59e0b];
      const carMesh = createPlayerMesh('sports_car', colors[Math.floor(Math.random() * colors.length)]);
      carMesh.position.set(laneX, 0, spawnZ);
      scene.add(carMesh);
      const speed = 50 + currentLevel * 0.7 + Math.random() * 25;
      trafficList.push({ mesh: carMesh, lane: laneIdx, z: spawnZ, speedKmh: speed, nearMissed: false });
    }

    function spawnCoinCluster(z) {
      const lane = LANES[Math.floor(Math.random() * LANES.length)];
      for (let c = 0; c < 3; c++) {
        const coin = new THREE.Mesh(coinGeo, coinMat);
        const cZ = z - c * 5;
        coin.position.set(lane, 0.8, cZ);
        scene.add(coin);
        coinsList.push({ mesh: coin, z: cZ, collected: false });
      }
    }

    const particles = [];
    const pGroup = new THREE.Group();
    scene.add(pGroup);

    function emitParticles(pos, count, type) {
      for (let i = 0; i < count; i++) {
        let geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
        let mat = new THREE.MeshBasicMaterial({ color: type === 'nitro' ? 0x00f5d4 : (type === 'spark' ? 0xffaa00 : 0x888888), transparent: true });
        let mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        pGroup.add(mesh);
        let vel = new THREE.Vector3(
          (Math.random() - 0.5) * (type === 'spark' ? 8 : 1),
          Math.random() * (type === 'spark' ? 6 : 1),
          type === 'nitro' ? 6 + Math.random() * 6 : (Math.random() - 0.5) * 4
        );
        particles.push({ mesh, vel, life: 0, maxLife: type === 'nitro' ? 0.25 : 0.5 });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        if (p.life >= p.maxLife) {
          pGroup.remove(p.mesh);
          particles.splice(i, 1);
          continue;
        }
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.material.opacity = 1 - (p.life / p.maxLife);
      }
    }

    window.addEventListener('keydown', e => {
      audio.init();
      keys[e.code] = true;
      if (e.code === 'Escape') togglePause();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const bindTouch = (id, onDown, onUp) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', e => { e.preventDefault(); audio.init(); onDown(); });
      el.addEventListener('touchend', e => { e.preventDefault(); onUp(); });
      el.addEventListener('mousedown', () => { audio.init(); onDown(); });
      el.addEventListener('mouseup', onUp);
    };
    bindTouch('m-left', () => touchSteer = -1, () => touchSteer = 0);
    bindTouch('m-right', () => touchSteer = 1, () => touchSteer = 0);
    bindTouch('m-gas', () => touchGas = true, () => touchGas = false);
    bindTouch('m-brake', () => touchBrake = true, () => touchBrake = false);
    bindTouch('m-nitro', () => touchNitro = true, () => touchNitro = false);

    document.getElementById('hud-btn-sound').onclick = () => {
      audio.init();
      const m = audio.toggleMute();
      document.getElementById('hud-btn-sound').innerText = m ? '🔇' : '🔊';
    };
    document.getElementById('hud-btn-pause').onclick = togglePause;
    document.getElementById('hud-btn-garage').onclick = openGarage;
    document.getElementById('pause-btn-resume').onclick = togglePause;
    document.getElementById('pause-btn-restart').onclick = restartRun;
    document.getElementById('pause-btn-garage').onclick = () => { togglePause(); openGarage(); };
    document.getElementById('garage-btn-close').onclick = closeGarage;
    document.getElementById('garage-btn-drive').onclick = closeGarage;
    document.getElementById('complete-btn-next').onclick = () => {
      currentLevel++;
      restartRun();
      document.getElementById('modal-complete').classList.add('hidden');
    };
    document.getElementById('complete-btn-replay').onclick = () => {
      restartRun();
      document.getElementById('modal-complete').classList.add('hidden');
    };
    document.getElementById('failed-btn-retry').onclick = () => {
      restartRun();
      document.getElementById('modal-failed').classList.add('hidden');
    };
    document.getElementById('failed-btn-garage').onclick = () => {
      document.getElementById('modal-failed').classList.add('hidden');
      openGarage();
    };

    function togglePause() {
      if (isGameOver || isLevelComplete) return;
      isPaused = !isPaused;
      document.getElementById('modal-pause').classList.toggle('hidden', !isPaused);
    }

    function openGarage() {
      isPaused = true;
      renderGarage();
      document.getElementById('modal-garage').classList.remove('hidden');
    }
    function closeGarage() {
      document.getElementById('modal-garage').classList.add('hidden');
      isPaused = false;
      scene.remove(playerCar);
      const c = CARS_DATA.find(x => x.id === activeCarId) || CARS_DATA[0];
      playerCar = createPlayerMesh(c.id, c.color);
      scene.add(playerCar);
    }

    function renderGarage() {
      const container = document.getElementById('garage-cars-list');
      container.innerHTML = '';
      CARS_DATA.forEach(c => {
        const div = document.createElement('div');
        div.className = 'car-option ' + (c.id === activeCarId ? 'selected' : '');
        div.innerHTML = '<div><strong>' + c.name + '</strong> (' + c.category + ')<span class="car-swatch" style="background:' + c.color + '"></span></div>' +
          '<div>' + (c.unlocked ? (c.id === activeCarId ? 'Active' : 'Select') : (c.price + ' Coins')) + '</div>';
        div.onclick = () => {
          if (c.unlocked) {
            activeCarId = c.id;
            renderGarage();
          } else if (coins >= c.price) {
            coins -= c.price;
            c.unlocked = true;
            activeCarId = c.id;
            localStorage.setItem('hr_coins', coins);
            renderGarage();
          }
        };
        container.appendChild(div);
      });
      const active = CARS_DATA.find(x => x.id === activeCarId);
      document.getElementById('garage-stats-view').innerHTML =
        '<div class="stat-box"><div class="stat-box-label">Top Speed</div><div class="stat-box-val">' + active.speed + ' km/h</div></div>' +
        '<div class="stat-box"><div class="stat-box-label">Handling</div><div class="stat-box-val">' + active.handling + '%</div></div>';
    }

    function restartRun() {
      posX = 0; posZ = 0; speedKmh = 0; distanceDriven = 0; coinsRun = 0; nearMissCount = 0; nitroPercent = 100;
      isGameOver = false; isLevelComplete = false; isPaused = false;
      trafficList.forEach(t => scene.remove(t.mesh));
      trafficList.length = 0;
      coinsList.forEach(c => scene.remove(c.mesh));
      coinsList.length = 0;
      for (let i = 0; i < roadSegments.length; i++) {
        const z = -i * SEG_LEN;
        roadSegments[i].zPos = z;
        roadSegments[i].group.position.z = z;
      }
    }

    let lastTime = performance.now();
    function gameLoop(time) {
      requestAnimationFrame(gameLoop);
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      if (isPaused || isGameOver || isLevelComplete) {
        renderer.render(scene, camera);
        return;
      }

      const activeCar = CARS_DATA.find(x => x.id === activeCarId) || CARS_DATA[0];
      const maxTargetDist = Math.round(600 + Math.pow(currentLevel, 1.25) * 20);

      const isUp = keys['KeyW'] || keys['ArrowUp'] || touchGas;
      const isDown = keys['KeyS'] || keys['ArrowDown'] || touchBrake;
      const isLeft = keys['KeyA'] || keys['ArrowLeft'] || touchSteer < -0.2;
      const isRight = keys['KeyD'] || keys['ArrowRight'] || touchSteer > 0.2;
      const wantsNitro = (keys['ShiftLeft'] || keys['Space'] || touchNitro) && nitroPercent > 5;

      if (wantsNitro && speedKmh > 30) {
        if (!isNitroActive) audio.startNitro();
        isNitroActive = true;
        nitroPercent = Math.max(0, nitroPercent - (100 / activeCar.nitro) * dt);
      } else {
        if (isNitroActive) audio.stopNitro();
        isNitroActive = false;
        if (speedKmh > 20) nitroPercent = Math.min(100, nitroPercent + 8 * dt);
      }

      let targetMaxSpeed = activeCar.speed * (isNitroActive ? 1.3 : 1.0);
      if (isUp) {
        speedKmh = THREE.MathUtils.lerp(speedKmh, targetMaxSpeed, (activeCar.accel / 100) * 0.85 * dt);
      } else if (isDown) {
        speedKmh = THREE.MathUtils.lerp(speedKmh, 0, 3.5 * dt);
      } else {
        speedKmh = Math.max(0, speedKmh - 25 * dt);
      }

      let steer = 0;
      if (isLeft) steer -= 1;
      if (isRight) steer += 1;
      if (touchSteer !== 0) steer = touchSteer;

      posX += steer * (activeCar.handling / 100) * 14 * dt * Math.min(1, speedKmh / 50);
      posX = Math.max(-5.8, Math.min(5.8, posX));

      const forwardMps = speedKmh / 3.6;
      posZ -= forwardMps * dt;
      distanceDriven += forwardMps * dt;

      playerCar.position.set(posX, 0, posZ);
      playerCar.rotation.y = -steer * 0.15;
      playerCar.rotation.z = -steer * 0.08;

      if (isNitroActive) {
        emitParticles(new THREE.Vector3(posX, 0.35, posZ + 2.2), 2, 'nitro');
      } else if (isUp && Math.random() > 0.6) {
        emitParticles(new THREE.Vector3(posX, 0.35, posZ + 2.2), 1, 'smoke');
      }

      audio.updateEngine(speedKmh, activeCar.speed, isUp || isNitroActive);

      camera.position.x = THREE.MathUtils.lerp(camera.position.x, posX * 0.7, 10 * dt);
      camera.position.y = 4.1 + (speedKmh / 200) * 0.5;
      camera.position.z = posZ + 8.2 + (speedKmh / 200) * 1.5;
      camera.lookAt(posX * 0.3, 1.2, posZ - 20);

      roadSegments.forEach(seg => {
        if (seg.zPos > posZ + SEG_LEN) {
          let minZ = 0;
          roadSegments.forEach(s => { if (s.zPos < minZ) minZ = s.zPos; });
          const nZ = minZ - SEG_LEN;
          seg.zPos = nZ;
          seg.group.position.z = nZ;
          if (Math.random() > 0.4) spawnCoinCluster(nZ);
        }
      });

      trafficTimer += dt;
      if (trafficTimer > Math.max(0.7, 2.2 - currentLevel * 0.015) && trafficList.length < 16) {
        trafficTimer = 0;
        spawnTraffic();
      }

      for (let i = trafficList.length - 1; i >= 0; i--) {
        const t = trafficList[i];
        t.z -= (t.speedKmh / 3.6) * dt;
        t.mesh.position.z = t.z;

        if (t.z > posZ + 40 || t.z < posZ - 250) {
          scene.remove(t.mesh);
          trafficList.splice(i, 1);
          continue;
        }

        const dZ = Math.abs(t.z - posZ);
        const dX = Math.abs(t.mesh.position.x - posX);
        if (dZ < 3.6 && dX < 1.6) {
          isGameOver = true;
          audio.stopNitro();
          audio.playCrash();
          emitParticles(new THREE.Vector3(posX, 1, posZ), 40, 'spark');
          coins += coinsRun;
          localStorage.setItem('hr_coins', coins);
          document.getElementById('failed-coins').innerText = '+' + coinsRun;
          document.getElementById('failed-distance').innerText = Math.round(distanceDriven) + 'm';
          document.getElementById('modal-failed').classList.remove('hidden');
          return;
        }

        if (!t.nearMissed && dZ < 3.2 && dX < 2.5 && dX > 1.6 && speedKmh > t.speedKmh + 20) {
          t.nearMissed = true;
          nearMissCount++;
          coinsRun += 5;
          coins += 5;
          audio.playCoin();
        }
      }

      for (let i = coinsList.length - 1; i >= 0; i--) {
        const c = coinsList[i];
        c.mesh.rotation.y += 3 * dt;
        if (!c.collected && Math.abs(c.z - posZ) < 2.2 && Math.abs(c.mesh.position.x - posX) < 1.6) {
          c.collected = true;
          coinsRun++;
          coins++;
          audio.playCoin();
          scene.remove(c.mesh);
          coinsList.splice(i, 1);
        }
      }

      if (distanceDriven >= maxTargetDist) {
        isLevelComplete = true;
        audio.stopNitro();
        audio.playLevelWin();
        const reward = 100 + currentLevel * 25;
        coinsRun += reward;
        coins += reward;
        localStorage.setItem('hr_coins', coins);
        document.getElementById('complete-title').innerText = 'LEVEL ' + currentLevel + ' COMPLETE!';
        document.getElementById('complete-coins').innerText = '+' + coinsRun;
        document.getElementById('complete-near-miss').innerText = nearMissCount;
        document.getElementById('modal-complete').classList.remove('hidden');
      }

      document.getElementById('hud-speed').innerText = Math.round(speedKmh);
      document.getElementById('hud-coins').innerText = coins;
      document.getElementById('hud-level').innerText = 'LEVEL ' + currentLevel + ' / 100';
      document.getElementById('hud-distance-text').innerText = Math.round(distanceDriven) + 'm / ' + maxTargetDist + 'm';
      const pct = Math.min(100, (distanceDriven / maxTargetDist) * 100);
      document.getElementById('hud-progress-fill').style.width = pct + '%';
      document.getElementById('hud-nitro-fill').style.width = nitroPercent + '%';
      document.getElementById('hud-nitro-fill').classList.toggle('active', isNitroActive);
      document.getElementById('hud-nitro-pct').innerText = Math.round(nitroPercent) + '%';

      updateParticles(dt);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
