<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: 'Inter', Helvetica, Arial, sans-serif;
        background: light-dark(#F8F8F7, #191919);
        color: light-dark(#1f1f1f, #e3e3e3);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }

      .container {
        background: light-dark(#FFFFFF, #1F1F1F);
        padding: 32px;
        border-radius: 16px;
        border: 1px solid light-dark(#E2E3E4, #3E3E3E);
        max-width: min(80%, 500px);
        width: 100%;
        color: light-dark(#2B2D31, #D4D4D4);
      }

      h1 {
        font-size: 20px;
        font-weight: 500;
        margin-top: 1rem;
        margin-bottom: 1rem;
        color: light-dark(#2B2D31, #D4D4D4);
      }

      p {
        font-size: 14px;
        color: light-dark(#2B2D31, #D4D4D4);
        line-height: 21px;
        margin: 0 0 1.5rem 0;
      }

      .logo {
        border-radius: 10px;
        display: block;
        margin: 0 auto 2rem auto;
      }

      button {
        background-color: light-dark(#fff, #323232);
        color: light-dark(#2B2D31, #FCFCFC);
        border: 1px solid light-dark(#E2E3E4, #3E3E3E);
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 14px;
        line-height: 21px;
        cursor: pointer;
        transition: background-color 0.2s;
        font-weight: 400;
        font-family: 'Inter', Helvetica, Arial, sans-serif;
        width: 100%;
      }

      button:hover {
        background-color: light-dark(#EAEAEB, #424242);
      }

      .button-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 2rem;
      }

      .status {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        background: #d4edda;
        color: #155724;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        class="logo"
        src="https://www.gstatic.com/images/branding/productlogos/ai_studio/v1/web-512dp/logo_ai_studio_color_1x_web_512dp.png"
        alt="AI Studio Logo"
        width="128"
        height="128"
      />
      <span class="status">✓ Loaded Successfully</span>
      <h1>Welcome to My App</h1>
      <p>
        Your application is now ready to use. The cookie check has been removed so it works
        perfectly on GitHub Pages.
      </p>
      <div class="button-container">
        <button onclick="startApp()">Start App</button>
      </div>
    </div>

    <script>
      function startApp() {
        alert("App started! Yahan aap apna asli game ya app load kar sakte hain.");
        // Yahan aap apna asli code ya redirect daal sakte hain
        // Example: window.location.href = "your-app-url";
      }

      console.log("App loaded successfully without cookie errors.");
    </script>
  </body>
</html>
